<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- user-scalable=no matches how the home-screen PWA is meant to feel —
         a native app, not a webpage users can pinch-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS home-screen PWA: these aren't covered by the web manifest (which
         Android/Chrome reads) — Safari needs its own meta tags to launch
         full-screen with the right status bar and app icon. The manifest
         link + theme-color are injected by vite-plugin-pwa at build time. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IPO Ledger" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Warms up the connection (DNS + TLS) to Supabase before the first API
         call actually fires, since every page hits it immediately on mount. -->
    <link rel="preconnect" href="https://nzflndquzlzafrbyivyz.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://nzflndquzlzafrbyivyz.supabase.co" />
    <title>IPO Ledger</title>
    <script>
      // Set the theme before paint so there's no light-mode flash on load.
      try {
        var theme = localStorage.getItem('theme') || 'light'
        document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Donut chart</title>
<style>
  body {
    background: #0f1115;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .chart-wrap {
    position: relative;
    width: 220px;
    height: 220px;
  }
  .center-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .center-label .value {
    font-size: 28px;
    font-weight: 700;
    color: #ffffff;
  }
  .center-label .unit {
    font-size: 13px;
    color: #8b8f9a;
  }
</style>
</head>
<body>

<div class="chart-wrap">
  <canvas id="donutChart" role="img" aria-label="Donut chart"></canvas>
  <div class="center-label">
    <div class="value" id="centerValue"></div>
    <div class="unit">apps</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  // ---- Data: edit this array to update the chart ----
  const data = [
    { label: "Mohit Kumar Singh", value: 20,  color: "#2ad4e0" },
    { label: "avinash rai",       value: 5.5, color: "#8b6de0" },
    { label: "Harsh Kohli",       value: 2.5, color: "#f0c94a" },
    { label: "Namanpreet",        value: 2.5, color: "#f06fa0" },
    { label: "Jigyansh Varshney", value: 0.5, color: "#8a8f99" }
  ];

  document.getElementById("centerValue").textContent =
    data.reduce((sum, d) => sum + d.value, 0);

  new Chart(document.getElementById("donutChart"), {
    type: "doughnut",
    data: {
      labels: data.map(d => d.label),
      datasets: [{
        data: data.map(d => d.value),
        backgroundColor: data.map(d => d.color),
        borderColor: "#0f1115",   // must match the background behind the chart
        borderWidth: 3,
        borderRadius: 6,          // rounded segment ends
        spacing: 3                // gap between segments
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: "68%",              // ring thickness
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw}` }
        }
      }
    }
  });
</script>

</body>
</html>
